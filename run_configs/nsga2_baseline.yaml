# ─────────────────────────────────────────────────────────────
# run_configs/nsga2.yaml
# Configuration for vanilla NSGA-II (pymoo backbone)
# Experiment: Hardware-Aware Multi-Objective NAS on NAS-Bench-201
#
# Run with:
#   python experiments/run_nsga2.py --config run_configs/nsga2.yaml
# Or override individual fields:
#   python experiments/run_nsga2.py --config run_configs/nsga2.yaml --device fpga
# ─────────────────────────────────────────────────────────────

# ── Experiment identity ───────────────────────────────────────
experiment:
  name: nsga2_vanilla
  description: >
    Vanilla NSGA-II baseline for hardware-aware multi-objective NAS.
    SBX crossover (eta=15) + polynomial mutation (eta=20) with
    RoundingRepair for integer decision variables, crowding-distance
    survivor selection. No local search. Serves as the primary
    baseline for the KL-guided memetic extension.
  version: "1.0"

# ── Datasets ──────────────────────────────────────────────────
# run_nsga2.py iterates over all three datasets
datasets:
  - cifar10
  - cifar100
  - ImageNet16-120

# ── Hardware targets ──────────────────────────────────────────
# run_nsga2.py iterates over all six devices
devices:
  - fpga
  - edgegpu
  - edgetpu                       # added: present in run_nsga2.py DEVICES list
  - raspi4
  - pixel3
  - eyeriss

# ── Search space ──────────────────────────────────────────────
# Single integer decision variable: arch_index in [0, SEARCH_SPACE_SIZE - 1]
# SEARCH_SPACE_SIZE = 15625 (HWNASLoader.SEARCH_SPACE_SIZE)
search_space:
  benchmark: nasbench201
  n_var: 1                        # one integer decision variable (arch_index)
  arch_index_min: 0
  arch_index_max: 15624           # hw_loader.SEARCH_SPACE_SIZE - 1
  n_edges: 6
  n_ops: 5
  ops:
    0: none
    1: skip_connect
    2: nor_conv_1x1
    3: nor_conv_3x3
    4: avg_pool_3x3

# ── Algorithm hyperparameters ─────────────────────────────────
algorithm:
  name: nsga2
  backend: pymoo                  # uses pymoo NSGA2 implementation

  population_size: 50             # pop_size default in run() and run_nsga2.py
  n_gen: 20                       # termination criterion: get_termination("n_gen", 20)
  seed: 42                        # passed to pymoo minimize()

  # Sampling
  sampling:
    type: IntegerRandomSampling   # draws uniform integers in [arch_index_min, arch_index_max]

  # Crossover — Simulated Binary Crossover (SBX) + integer repair
  crossover:
    type: sbx                     # SBX, NOT uniform; vtype=float + RoundingRepair snaps to int
    prob: 0.9                     # probability of applying crossover to a pair
    eta: 15                       # distribution index (standard NSGA-II default)
    vtype: float
    repair: RoundingRepair

  # Mutation — Polynomial Mutation (PM) + integer repair
  mutation:
    type: pm                      # PM, NOT point mutation
    prob: 1.0                     # prob=1/n_var = 1.0 for a single decision variable
    eta: 20                       # distribution index (standard NSGA-II default)
    vtype: float
    repair: RoundingRepair

  # Survivor selection
  selection:
    type: nsga2                   # non-dominated sort + crowding distance
    eliminate_duplicates: true    # critical with discrete space: collisions are frequent

# ── Objectives ────────────────────────────────────────────────
# Internally: f[0] = -accuracy (minimise), f[1] = latency (minimise)
# Reported as accuracy (%) and latency (ms) in output CSVs
objectives:
  - name: accuracy
    direction: maximise           # negated internally: f[0] = -accuracy
    source: nasbench201
  - name: latency
    direction: minimise           # f[1] = latency, already in minimisation form
    source: hwnas_bench

# ── Reference point for hypervolume ──────────────────────────
# Computed dynamically in compute_metrics() using a 5% margin on
# the joint min/max of approx + true front — NOT a fixed global ref.
# ref_acc  = min(all_acc) - 0.05 * |min(all_acc)|
# ref_lat  = max(all_lat) + 0.05 * |max(all_lat)|
hypervolume:
  ref_margin: 0.05                # margin fraction applied to both axes
  # ref_acc and ref_lat_margin are NOT fixed; derived per-run from data

# ── Statistical reporting ─────────────────────────────────────
evaluation:
  n_runs: 1                       # run_nsga2.py runs once per (dataset, device) pair
  base_seed: 42                   # single seed passed to run()

# ── Output ────────────────────────────────────────────────────
output:
  results_dir: results_nsga2      # root: results_nsga2/<dataset>/<device>/
  save_pareto_front: true         # nsga2_front.csv  — arch_index, accuracy, latency
  save_plot: true                 # comparison.png   — scatter + metrics bar chart
  format: csv                     # pandas .to_csv(), NOT json